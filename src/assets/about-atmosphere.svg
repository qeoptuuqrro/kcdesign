<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="violet-left" cx="0%" cy="0%" r="74%">
      <stop offset="0%" stop-color="#2d36f2" stop-opacity="0.9" />
      <stop offset="44%" stop-color="#5536d7" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#08040e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-right" cx="100%" cy="2%" r="74%">
      <stop offset="0%" stop-color="#5f3cff" stop-opacity="0.84" />
      <stop offset="46%" stop-color="#5b34c7" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#08040e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="salmon-core" cx="50%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#ee8a98" stop-opacity="0.92" />
      <stop offset="42%" stop-color="#d0697d" stop-opacity="0.74" />
      <stop offset="78%" stop-color="#4d1b32" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#08040e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amber-core" cx="51%" cy="70%" r="64%">
      <stop offset="0%" stop-color="#ffa35f" stop-opacity="0.86" />
      <stop offset="48%" stop-color="#df6648" stop-opacity="0.55" />
      <stop offset="84%" stop-color="#3d130e" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#050205" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pearl-cap" cx="51%" cy="5%" r="48%">
      <stop offset="0%" stop-color="#fff4df" stop-opacity="0.44" />
      <stop offset="42%" stop-color="#f2bda3" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#050205" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="black-vignette" cx="50%" cy="37%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="58%" stop-color="#000000" stop-opacity="0.05" />
      <stop offset="90%" stop-color="#000000" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </radialGradient>
    <linearGradient id="bottom-falloff" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="84%" stop-color="#000000" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.46" />
    </linearGradient>
    <filter id="soften" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <rect width="1800" height="1200" fill="#030205" />
  <g filter="url(#soften)">
    <rect width="1800" height="1200" fill="url(#violet-left)" />
    <rect width="1800" height="1200" fill="url(#violet-right)" />
    <rect width="1800" height="1200" fill="url(#pearl-cap)" />
    <rect width="1800" height="1200" fill="url(#salmon-core)" />
    <rect width="1800" height="1200" fill="url(#amber-core)" />
  </g>
  <rect width="1800" height="1200" fill="url(#black-vignette)" />
  <rect width="1800" height="1200" fill="url(#bottom-falloff)" />
</svg>
